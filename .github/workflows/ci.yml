name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: .venv/bin/python -m ruff check .

      # No real GROQ_API_KEY/QDRANT_URL secrets in CI - vector_store.py falls
      # back to an in-memory Qdrant instance when QDRANT_URL is unset, and
      # every test that would otherwise need a real Groq call is excluded
      # here (docs/TEST_STRATEGY.md's evaluation suite is a separate,
      # slower-cadence process, never a CI gate - see evaluation/README.md).
      - name: Test (pytest, excluding live Groq calls)
        working-directory: backend
        run: .venv/bin/python -m pytest tests -v -m "not live_groq"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
