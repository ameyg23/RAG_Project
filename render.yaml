services:
  - type: web
    name: rag-chatbot-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        value: https://rag-chatbot-frontend-b7i.pages.dev
      # Cap numpy/scipy/onnxruntime's BLAS thread pools (ADR-20: the
      # embedding runtime moved from sentence-transformers/torch to
      # fastembed/ONNX Runtime, but this same cap still applies). On a
      # 512MB free-tier instance, each unbounded OpenMP/MKL/OpenBLAS thread
      # pool adds its own stack + arena memory on top of model weights; with
      # only 1 shared vCPU anyway, multithreading buys negligible speed
      # here. No behavior change.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
