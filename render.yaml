services:
  - type: web
    name: rag-chatbot-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        value: http://localhost:5173
      # Cap torch/numpy/scipy's BLAS thread pools. On a 512MB free-tier
      # instance, each unbounded OpenMP/MKL/OpenBLAS thread pool adds its own
      # stack + arena memory on top of model weights; with only 1 shared vCPU
      # anyway, multithreading buys negligible speed here. No behavior change.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
